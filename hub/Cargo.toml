[workspace]
resolver = "2"
members = [
    "crates/hh-core",
    "crates/hh-db",
    "crates/hh-auth",
    "crates/hh-net",
    "crates/hh-transfer",
    "crates/hh-storage",
    "crates/hh-photos",
    "crates/hh-remote",
    "crates/hh-hw",
    "crates/hh-stream",
    "crates/hh-service",
    "crates/hh-tools",
    "crates/hh-session",
    "crates/hh-tray",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.78"

[workspace.dependencies]
# async runtime / http
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
axum = { version = "0.8", features = ["ws", "macros", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
bytes = "1"
futures = "0.3"
http = "1"
mime = "0.3"

# tls / crypto
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
blake3 = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# storage / data
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
ulid = { version = "1", features = ["serde"] }
fs2 = "0.4"

# media
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
kamadak-exif = "0.5"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# discovery / system
mdns-sd = "0.11"
sysinfo = "0.32"

# cli / tools
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
indicatif = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
