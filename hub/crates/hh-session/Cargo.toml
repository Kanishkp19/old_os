[package]
name = "hh-session"
description = "Home Hub per-user session helper: input/power injection, screen capture, hotspot (TRD §9)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hh-session"
path = "src/main.rs"

[features]
# Real WebRTC media host + cast window (openh264/minifb). Default off so the
# core helper (input/power/system info) builds fast everywhere; CI enables it.
screen = ["dep:webrtc", "dep:minifb"]
default = []

[dependencies]
hh-core = { path = "../hh-core" }
hh-remote = { path = "../hh-remote" }
anyhow = "1"
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
openh264 = { version = "0.6", features = ["source"] }
sysinfo.workspace = true
once_cell = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_Pipes",
    "Win32_System_Shutdown",
    "Foundation",
    "Networking_Connectivity",
] }
wmi = "0.14"

# Screen media host (feature `screen`): webrtc-rs for the LAN media path,
# minifb for the phone→laptop cast receiver window.
webrtc = { version = "0.13", optional = true }
minifb = { version = "0.27", optional = true }
