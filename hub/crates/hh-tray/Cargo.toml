[package]
name = "hh-tray"
description = "Home Hub tray app: status, quick actions, update channel (FR-1.3, M3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hh-tray"
path = "src/main.rs"

[dependencies]
hh-core = { path = "../hh-core" }
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = "0.14"
winit = "0.30"
open = "5"
# Loopback-only HTTP to the dashboard API (no TLS needed, tiny dep tree).
ureq = { version = "2", default-features = false, features = ["json"] }
rfd = "0.15"
