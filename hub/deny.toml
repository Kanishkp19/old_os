[bans]
multiple_versions = "warn"
wildcards = "warn"
highlight = "all"

[advisories]
db-path = "~/.cargo/advisory-db"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
