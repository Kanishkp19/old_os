[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[advisories]
db-path = "~/.cargo/advisory-db"
unmaintained = "none"
unsound = "none"
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0008", # Openh264 decoding heap overflow (webrtc LAN media path)
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
