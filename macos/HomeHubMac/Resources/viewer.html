<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><style>html,body{margin:0;width:100%;height:100%;background:#151820}video{width:100%;height:100%;object-fit:contain}#status{position:absolute;color:#fff;font:16px system-ui;top:15px;left:15px}</style></head><body><video id="screen" autoplay playsinline muted></video><div id="status"></div><script>
'use strict';
let peer, heartbeat, stopped = false;
const post = (action, data) => window.webkit.messageHandlers.screen.postMessage({action, ...data});
window.setStatus = value => document.querySelector('#status').textContent = value;
window.acceptAnswer = async answer => {
  try { await peer.setRemoteDescription({type:'answer',sdp:answer}); }
  catch (error) { post('error',{message:String(error)}); stop(); }
};
const stop = () => { if(stopped)return; stopped=true; clearInterval(heartbeat); if(peer)peer.close(); post('stop',{}); };
(async () => {
  try {
    peer = new RTCPeerConnection({iceServers:[],bundlePolicy:'max-bundle'});
    peer.addTransceiver('video',{direction:'recvonly'});
    peer.ontrack = event => {
      document.querySelector('#screen').srcObject = event.streams[0] || new MediaStream([event.track]);
      setStatus('');
    };
    peer.onconnectionstatechange = () => {
      if(['failed','closed','disconnected'].includes(peer.connectionState)) stop();
    };
    await peer.setLocalDescription(await peer.createOffer());
    await new Promise((resolve,reject) => {
      if(peer.iceGatheringState==='complete')return resolve();
      const timeout=setTimeout(()=>reject(new Error('ice_timeout')),10000);
      peer.onicegatheringstatechange=()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timeout);resolve();}};
    });
    if(stopped)return;
    post('offer',{sdp:peer.localDescription.sdp});
    heartbeat=setInterval(()=>post('heartbeat',{}),15000);
  } catch(error) { post('error',{message:String(error)}); stop(); }
})();
window.addEventListener('pagehide',stop);
</script></body></html>
