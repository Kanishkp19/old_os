image esp.vfat {
  vfat {
    label = "HOMEHUB_ESP"
    files = { "EFI/BOOT/BOOTX64.EFI", "EFI/BOOT/grub.cfg", "EFI/BOOT/grubenv", "bzImage" }
  }
  size = 512M
}

image homehub-os.img {
  hdimage {
    partition-table-type = "gpt"
  }
  partition esp {
    partition-type-uuid = "U"
    bootable = true
    image = "esp.vfat"
    size = 512M
  }
  partition root_a {
    partition-type-uuid = "L"
    image = "rootfs.squashfs"
    size = 6G
  }
  partition root_b {
    partition-type-uuid = "L"
    image = "rootfs.squashfs"
    size = 6G
  }
  partition recovery {
    partition-type-uuid = "L"
    image = "recovery.img"
    size = 2G
  }
  partition data {
    partition-type-uuid = "L"
    image = "data.ext4"
    size = 16G
  }
}
