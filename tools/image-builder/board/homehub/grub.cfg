set timeout=3
set default=0
insmod part_gpt
insmod fat
insmod squash4

search --no-floppy --label HOMEHUB_ESP --set=esp
load_env --file=($esp)/EFI/BOOT/grubenv active_slot previous_slot boot_counter
if [ -z "$active_slot" ]; then set active_slot=a; fi
if [ -z "$previous_slot" ]; then set previous_slot=b; fi
if [ -z "$boot_counter" ]; then set boot_counter=0; fi

if [ "$boot_counter" -ge 3 ]; then
  set active_slot=$previous_slot
  set boot_counter=0
  save_env --file=($esp)/EFI/BOOT/grubenv active_slot boot_counter
fi

function boot_slot {
  set root_slot=$1
  if [ "$root_slot" = a ]; then
    set root_label=root_a
  else
    set root_label=root_b
  fi
  if [ "$boot_counter" = 0 ]; then
    set boot_counter=1
  elif [ "$boot_counter" = 1 ]; then
    set boot_counter=2
  else
    set boot_counter=3
  fi
  save_env --file=($esp)/EFI/BOOT/grubenv boot_counter
  linux ($esp)/bzImage root=PARTLABEL=$root_label rootfstype=squashfs ro console=ttyS0,115200 console=tty0
}

menuentry 'Home Hub OS (active slot)' {
  boot_slot $active_slot
}
menuentry 'Home Hub OS (slot A)' {
  boot_slot a
}
menuentry 'Home Hub OS (slot B)' {
  boot_slot b
}
menuentry 'Home Hub recovery' {
  search --no-floppy --part-label recovery --set=recovery
  chainloader ($recovery)/EFI/BOOT/BOOTX64.EFI
}
