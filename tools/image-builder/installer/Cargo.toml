[package]
name = "homehub-installer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "homehub-installer"
path = "src/main.rs"

[[bin]]
name = "homehub-installer-trial"
path = "src/trial.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
